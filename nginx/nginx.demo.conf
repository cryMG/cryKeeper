worker_processes 1;

events {
    worker_connections 1024;
}

http {
    map $host $crykeeper_path_prefix {
        default /crykeeper;
        cap.localhost /cap-check;
        full.localhost /full-check;
        dummy.localhost /dummy-check;
        hcaptcha.localhost /hcaptcha-check;
        altcha.localhost /altcha-check;
    }

    upstream crykeeper_app {
        server crykeeper:5000;
    }

    upstream demo_backend_app {
        server demo-backend:5001;
    }

    server {
        listen 80;
        server_name _;
        return 308 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name full.localhost;
        absolute_redirect off;
        ssl_certificate /etc/nginx/certs/demo.crt;
        ssl_certificate_key /etc/nginx/certs/demo.key;
        ssl_session_cache shared:demo_tls:10m;
        ssl_session_timeout 10m;

        location = /_crykeeper_check {
            internal;
            proxy_pass http://crykeeper_app$crykeeper_path_prefix/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
        }

        location @crykeeper_challenge {
            proxy_pass http://crykeeper_app$auth_redirect;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ~ ^/full-check(/|$) {
            proxy_pass http://crykeeper_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            auth_request /_crykeeper_check;
            auth_request_set $auth_redirect $upstream_http_x_auth_redirect;
            error_page 401 =403 @crykeeper_challenge;

            proxy_pass http://demo_backend_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 443 ssl;
        server_name dashboard.localhost;
        absolute_redirect off;
        ssl_certificate /etc/nginx/certs/demo.crt;
        ssl_certificate_key /etc/nginx/certs/demo.key;
        ssl_session_cache shared:demo_tls:10m;
        ssl_session_timeout 10m;

        location = / {
            proxy_pass http://crykeeper_app/_crykeeper/dashboard;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /metrics {
            proxy_pass http://crykeeper_app/_crykeeper/metrics;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ~ ^/_crykeeper/(dashboard|metrics)$ {
            proxy_pass http://crykeeper_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ^~ /_crykeeper/static/ {
            proxy_pass http://crykeeper_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        absolute_redirect off;
        ssl_certificate /etc/nginx/certs/demo.crt;
        ssl_certificate_key /etc/nginx/certs/demo.key;
        ssl_session_cache shared:demo_tls:10m;
        ssl_session_timeout 10m;

        location = /_crykeeper_check {
            internal;
            proxy_pass http://crykeeper_app$crykeeper_path_prefix/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
        }

        location @crykeeper_challenge {
            proxy_pass http://crykeeper_app$auth_redirect;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ^~ /cap/ {
            proxy_pass http://cap:3000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /protected/ {
            auth_request /_crykeeper_check;
            auth_request_set $auth_redirect $upstream_http_x_auth_redirect;
            error_page 401 =403 @crykeeper_challenge;

            proxy_pass http://demo_backend_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /crykeeper {
            proxy_pass http://crykeeper_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ~ ^/(crykeeper|cap-check|full-check|dummy-check|hcaptcha-check|altcha-check)(/|$) {
            proxy_pass http://crykeeper_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            proxy_pass http://demo_backend_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
